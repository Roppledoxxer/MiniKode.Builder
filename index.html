<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MiniKode.Builder — MiniKode Lang v1.2.1</title>
  <style>
    * { box-sizing: border-box; }
    :root {
      --bg: #071026;
      --bg2: #071b2b;
      --panel: rgba(255,255,255,0.04);
      --muted: #94a3b8;
      --text: #e6eef6;
      --accent: #6ee7b7;
      --error: #ff6b6b;
      --success: #51cf66;
      --shadow: 0 16px 42px rgba(0,0,0,.22);
      --radius: 14px;
    }
    html, body {
      height: 100%;
      margin: 0;
      font-family: 'Fira Code', 'Monaco', 'Menlo', monospace;
      color: var(--text);
      background: linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
    }
    .container {
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .header {
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.3);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .header h2 {
      margin: 0;
      color: var(--accent);
      font-size: 18px;
      font-weight: 800;
    }
    .header-info {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
      font-size: 11px;
      color: var(--muted);
    }
    .header-stat { display: flex; gap: 6px; align-items: center; }
    .stat-value { color: var(--accent); font-weight: 800; }
    .wrap {
      flex: 1;
      min-height: 0;
      display: flex;
      gap: 12px;
      padding: 14px;
      overflow: hidden;
    }
    .panel {
      background: var(--panel);
      border: 1px solid rgba(255,255,255,.05);
      border-radius: var(--radius);
      padding: 12px;
      display: flex;
      flex-direction: column;
      min-height: 0;
      box-shadow: var(--shadow);
      backdrop-filter: blur(8px);
    }
    .panel-title {
      font-size: 12px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: .5px;
    }
    .editor-panel { flex: 1; min-width: 0; }
    .editor-wrapper { flex: 1; min-height: 0; display: flex; }
    textarea {
      width: 100%;
      flex: 1;
      min-height: 0;
      resize: none;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 10px;
      background: rgba(3, 10, 22, .45);
      color: #c8d6e5;
      outline: none;
      font: inherit;
      font-size: 12px;
      line-height: 1.6;
      padding: 12px;
      white-space: pre;
      tab-size: 2;
    }
    textarea:focus {
      border-color: rgba(110, 231, 183, 0.32);
      box-shadow: 0 0 0 2px rgba(110, 231, 183, 0.08);
    }
    .controls-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      flex-wrap: wrap;
      padding: 8px;
      background: rgba(255,255,255,.02);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.03);
    }
    button {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid rgba(110, 231, 183, 0.26);
      background: linear-gradient(135deg, rgba(110, 231, 183, 0.10), rgba(110, 231, 183, 0.05));
      color: var(--accent);
      cursor: pointer;
      font-weight: 700;
      font-size: 11px;
      font-family: inherit;
      transition: transform .15s ease, box-shadow .15s ease, background .15s ease;
      text-transform: uppercase;
      letter-spacing: .3px;
    }
    button:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(110, 231, 183, 0.12); }
    button:active { transform: translateY(0); }
    button.danger {
      border-color: rgba(255, 107, 107, 0.28);
      background: linear-gradient(135deg, rgba(255, 107, 107, 0.10), rgba(255, 107, 107, 0.05));
      color: var(--error);
    }
    .right-panel {
      width: min(720px, 42vw);
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-height: 0;
    }
    .preview-container {
      background: white;
      border-radius: var(--radius);
      flex: 1;
      overflow: hidden;
      border: 1px solid rgba(0, 0, 0, 0.08);
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
      min-height: 240px;
    }
    .preview-header {
      padding: 10px 14px;
      background: #f8f9fa;
      border-bottom: 1px solid #e9ecef;
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      font-weight: 700;
      color: #495057;
    }
    .preview-content {
      width: 100%;
      flex: 1;
      overflow: auto;
      padding: 0;
      position: relative;
      min-height: 240px;
      background: #fff;
    }
    .console-panel {
      font-family: inherit;
      background: linear-gradient(180deg, #051526 0%, #081a2a 100%);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 12px;
      border-radius: 10px;
      height: 180px;
      overflow-y: auto;
      color: var(--muted);
      font-size: 11px;
      line-height: 1.5;
    }
    .console-entry {
      margin-bottom: 6px;
      padding: 4px 0 4px 6px;
      border-left: 2px solid transparent;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .console-entry.info { color: #94a3b8; border-left-color: #4b5563; }
    .console-entry.ok { color: #51cf66; border-left-color: #37b24d; }
    .console-entry.err { color: #ff8787; border-left-color: #f03e3e; }
    .code-hint {
      background: rgba(255, 255, 255, 0.02);
      padding: 10px;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 10px;
      color: var(--muted);
      line-height: 1.5;
      border-left: 2px solid var(--accent);
      max-height: 160px;
      overflow-y: auto;
    }
    .code-hint code {
      background: rgba(0, 0, 0, 0.22);
      padding: 2px 6px;
      border-radius: 4px;
      color: var(--accent);
      font-size: 9px;
    }
    .templates-bar {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: 8px;
    }
    .template-btn {
      padding: 6px 10px;
      font-size: 10px;
      background: rgba(110, 231, 183, 0.08);
      border: 1px solid rgba(110, 231, 183, 0.2);
      color: var(--accent);
      border-radius: 6px;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease;
      flex: 1;
      min-width: 88px;
    }
    .template-btn:hover {
      background: rgba(110, 231, 183, 0.15);
      border-color: rgba(110, 231, 183, 0.35);
    }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.03); border-radius: 4px; }
    ::-webkit-scrollbar-thumb { background: rgba(110, 231, 183, 0.30); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(110, 231, 183, 0.5); }
    @media (max-width: 1200px) {
      .wrap { flex-direction: column; }
      .right-panel { width: 100%; }
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h2>🎨 MiniKode.Builder — MiniKode Lang (v1.2.1)</h2>
      <div class="header-info">
        <div class="header-stat"><span>Lines:</span><span class="stat-value" id="lineCount">0</span></div>
        <div class="header-stat"><span>Chars:</span><span class="stat-value" id="charCount">0</span></div>
        <div class="header-stat"><span>Commands:</span><span class="stat-value" id="commandCount">0</span></div>
        <div class="header-stat"><span>Errors:</span><span class="stat-value" id="errorCount">0</span></div>
      </div>
    </div>

    <div class="wrap">
      <div class="panel editor-panel">
        <div class="panel-title">📝 MiniKode Editor</div>
        <div class="editor-wrapper">
          <textarea id="editor" spellcheck="false" placeholder="Write pure MiniKode code here..."></textarea>
        </div>

        <div class="controls-bar">
          <button id="runBtn">▶ Run Code</button>
          <button id="clearBtn" class="danger">🗑 Clear All</button>
          <button id="formatBtn">✨ Format</button>
          <button id="lintBtn">🔎 Lint</button>
          <div style="flex: 1;"></div>
          <span style="font-size: 10px; color: var(--muted);">Ctrl+Enter to run</span>
        </div>

        <div style="margin-top: 8px;">
          <div class="panel-title" style="margin-top: 0; margin-bottom: 6px;">⚡ Quick Templates</div>
          <div class="templates-bar">
            <button class="template-btn" data-template="counter">Counter</button>
            <button class="template-btn" data-template="todo">Todo</button>
            <button class="template-btn" data-template="grid">Grid</button>
            <button class="template-btn" data-template="form">Form</button>
            <button class="template-btn" data-template="cards">Cards</button>
            <button class="template-btn" data-template="physics">Physics</button>
          </div>
        </div>

        <div class="code-hint" id="hint"></div>
      </div>

      <div class="right-panel">
        <div class="preview-container">
          <div class="preview-header">👁️ Live Preview</div>
          <div class="preview-content" id="preview-content"></div>
        </div>
        <div class="panel console-panel" id="console" role="log" tabindex="0"></div>
      </div>
    </div>
  </div>

  <script>
    const MINIKODE_VERSION = 'v1.2.1';

    const editor = document.getElementById('editor');
    const consoleEl = document.getElementById('console');
    const previewContent = document.getElementById('preview-content');
    const runBtn = document.getElementById('runBtn');
    const clearBtn = document.getElementById('clearBtn');
    const formatBtn = document.getElementById('formatBtn');
    const lintBtn = document.getElementById('lintBtn');
    const hintBox = document.getElementById('hint');
    const lineCount = document.getElementById('lineCount');
    const charCount = document.getElementById('charCount');
    const commandCount = document.getElementById('commandCount');
    const errorCount = document.getElementById('errorCount');

    const runtime = {
      elements: new Map(),
      errors: 0,
      commandCount: 0
    };

    const KNOWN_ACTIONS = new Set(['CREATE', 'UPDATE', 'DELETE', 'SET', 'IF', 'LOOP', 'CALL']);
    const KNOWN_PARAMS = new Set([
      'TEXT', 'HTML', 'STYLE', 'ATTR', 'CLASS', 'ID', 'APPEND', 'ONCLICK', 'ONEVENT', 'DATA',
      'PHYSICS', 'VELOCITY', 'GRAVITY', 'FRICTION', 'BOUNCE', 'VALUE', 'SHOW', 'HIDE', 'TOGGLE',
      'REMOVE', 'MOVE', 'RESIZE', 'FOCUS', 'BLUR', 'STORE', 'LOAD', 'DISABLED', 'CHECKED',
      'PLACEHOLDER', 'SRC', 'ALT', 'TITLE'
    ]);

    const templates = {

    };

    function log(msg, level = 'info') {
      const d = document.createElement('div');
      d.textContent = msg;
      d.className = `console-entry ${level}`;
      consoleEl.appendChild(d);
      consoleEl.scrollTop = consoleEl.scrollHeight;
    }

    function clearConsole() {
      consoleEl.innerHTML = '';
    }

    function updateStatistics() {
      const code = editor.value;
      lineCount.textContent = code ? code.split('\n').length : 0;
      charCount.textContent = code.length;
      commandCount.textContent = (code.match(/<BL\b/g) || []).length;
      errorCount.textContent = runtime.errors;
    }

    function getLineNumber(text, index) {
      return text.slice(0, index).split('\n').length;
    }

    function syntaxError(lineNo, message, snippet = '') {
      runtime.errors += 1;
      const tail = snippet ? ` | ${snippet}` : '';
      log(`Syntax error (line ${lineNo}): ${message}${tail}`, 'err');
      updateStatistics();
    }

    function extractProgram(text) {
      const start = text.indexOf('<BMK>');
      const end = text.indexOf('<EMK>');
      if (start === -1 || end === -1 || end <= start) return null;
      return text.slice(start + 5, end).trim();
    }

    function extractBlocksWithLines(program) {
      const blocks = [];
      const re = /<BL\s+([\s\S]*?)\s+EL>/g;
      let m;
      while ((m = re.exec(program)) !== null) {
        blocks.push({ text: m[1].trim(), line: getLineNumber(program, m.index) });
      }
      return blocks;
    }

    function parseShorthand(word) {
      let tag = 'div', id = null, classes = [];
      let buf = '', state = 'tag';
      for (const c of word) {
        if (c === '#') {
          if (state === 'tag' && buf) tag = buf;
          if (state === 'id' && buf) id = buf;
          if (state === 'class' && buf) classes.push(buf);
          buf = '';
          state = 'id';
          continue;
        }
        if (c === '.') {
          if (state === 'tag' && buf) tag = buf;
          if (state === 'id' && buf) id = buf;
          if (state === 'class' && buf) classes.push(buf);
          buf = '';
          state = 'class';
          continue;
        }
        buf += c;
      }
      if (buf) {
        if (state === 'tag') tag = buf;
        else if (state === 'id') id = buf;
        else if (state === 'class') classes.push(buf);
      }
      return { tag, id, classes };
    }

    function parseBlockTextStrict(text) {
      const re = /^\s*([A-Za-z_]+)\s+([^\s@,]+)\s*(?:@\s*\[([^\]]*)\])?\s*(?:,\s*\[([^\]]*)\])?\s*(?:,\s*(.*))?$/s;
      const m = text.match(re);
      if (!m) return { error: 'Invalid block syntax', parsed: null };

      const action = m[1].trim().toUpperCase();
      const thing = m[2].trim();
      const position = m[3] ? m[3].trim() : null;
      const size = m[4] ? m[4].trim() : null;
      const paramsRaw = m[5] ? m[5].trim() : '';

      if (!KNOWN_ACTIONS.has(action)) {
        return { error: `Unknown action "${action}"`, parsed: null };
      }

      return { error: null, parsed: { action, thing, position, size, paramsRaw } };
    }

    function splitParams(raw) {
      if (!raw) return [];
      const out = [];
      let current = '';
      let depth = 0;
      for (let i = 0; i < raw.length; i++) {
        const ch = raw[i];
        if (ch === '{' || ch === '(' || ch === '[') depth += 1;
        if (ch === '}' || ch === ')' || ch === ']') depth = Math.max(0, depth - 1);
        if ((ch === ',' || ch === ';') && depth === 0) {
          if (current.trim()) out.push(current.trim());
          current = '';
          continue;
        }
        current += ch;
      }
      if (current.trim()) out.push(current.trim());
      return out;
    }

    function parseParamsStrict(paramsRaw) {
      const errors = [];
      const params = [];
      if (!paramsRaw) return { params, errors };

      const parts = splitParams(paramsRaw);
      for (const part of parts) {
        const brace = part.indexOf('{');
        const semi = part.indexOf(';');

        if (brace > -1 && part.endsWith('}')) {
          const key = part.slice(0, brace).trim().toUpperCase();
          const value = part.slice(brace + 1, -1).trim();
          if (!KNOWN_PARAMS.has(key)) errors.push(`Unknown parameter "${key}"`);
          else if (!value) errors.push(`Parameter "${key}" has no value`);
          else params.push({ k: key, v: value });
          continue;
        }

        if (semi === -1) {
          errors.push(`Missing ";" in parameter "${part}"`);
          continue;
        }

        const key = part.slice(0, semi).trim().toUpperCase();
        const value = part.slice(semi + 1).trim();
        if (!KNOWN_PARAMS.has(key)) errors.push(`Unknown parameter "${key}"`);
        else if (!value) errors.push(`Parameter "${key}" has no value`);
        else params.push({ k: key, v: value });
      }

      return { params, errors };
    }

    function applyStyleFromString(el, cssString) {
      if (!cssString) return;
      const rules = cssString.split(';').map(s => s.trim()).filter(Boolean);
      for (const rule of rules) {
        const idx = rule.indexOf(':');
        if (idx === -1) continue;
        const prop = rule.slice(0, idx).trim();
        const val = rule.slice(idx + 1).trim();
        const jsProp = prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase());
        el.style[jsProp] = val;
      }
    }

    function applyAttrFromString(el, attrString) {
      if (!attrString) return;
      const parts = attrString.split(/[;|]/).map(s => s.trim()).filter(Boolean);
      for (const p of parts) {
        const eq = p.indexOf('=');
        if (eq === -1) {
          el.setAttribute(p, '');
        } else {
          el.setAttribute(p.slice(0, eq).trim(), p.slice(eq + 1).trim());
        }
      }
    }

    function ensureVisible(el) {
      const cs = getComputedStyle(el);
      if (cs.display === 'none') el.style.display = 'block';
      if (cs.opacity === '0') el.style.opacity = '1';
      if (el.offsetWidth === 0 && !el.matches('img,video,svg,canvas')) el.style.minWidth = el.style.minWidth || '50px';
      if (el.offsetHeight === 0 && !el.matches('img,video,svg,canvas')) el.style.minHeight = el.style.minHeight || '22px';
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function setElementValue(el, value) {
      if (!el) return;
      if ('value' in el) el.value = value;
      else el.textContent = value;
    }

    function handleMiniKodeClick(action) {
      switch (action) {
        case 'incrementCounter()': {
          const display = document.getElementById('display');
          let count = parseInt(display?.textContent || '0', 10) || 0;
          count += 1;
          if (display) {
            display.textContent = String(count);
            display.style.transform = 'scale(1.08)';
            setTimeout(() => display.style.transform = 'scale(1)', 150);
          }
          log(`Counter incremented to ${count}`, 'info');
          break;
        }
        case 'decrementCounter()': {
          const display = document.getElementById('display');
          let count = parseInt(display?.textContent || '0', 10) || 0;
          count -= 1;
          if (display) {
            display.textContent = String(count);
            display.style.transform = 'scale(1.08)';
            setTimeout(() => display.style.transform = 'scale(1)', 150);
          }
          log(`Counter decremented to ${count}`, 'info');
          break;
        }
        case 'resetCounter()':
          const display = document.getElementById('display');
          if (display) display.textContent = '0';
          log('Counter reset', 'info');
          break;
        case 'addTodoItem()': {
          const input = document.getElementById('task-input');
          const text = input?.value?.trim();
          if (!text) {
            log('Task text is empty', 'err');
            return;
          }
          const item = document.createElement('div');
          item.style.cssText = 'display:flex;align-items:center;gap:10px;padding:12px;background:#fafafa;border-radius:8px;border-left:4px solid #667eea;';
          item.innerHTML = `
            <input type="checkbox" style="width:18px;height:18px;cursor:pointer;" />
            <span style="flex:1;color:#333;font-size:13px;">${escapeHtml(text)}</span>
            <button style="padding:4px 10px;background:#ff6b6b;color:white;border:none;border-radius:4px;cursor:pointer;font-size:11px;">Delete</button>
          `;
          item.querySelector('button').addEventListener('click', () => item.remove());
          document.getElementById('tasks-list')?.appendChild(item);
          const empty = document.getElementById('empty-state');
          if (empty) empty.style.display = 'none';
          input.value = '';
          log('Task added', 'ok');
          break;
        }
        case 'submitForm()': {
          const name = document.getElementById('name')?.value?.trim();
          const email = document.getElementById('email')?.value?.trim();
          const message = document.getElementById('message')?.value?.trim();
          const status = document.getElementById('form-status');
          if (!status) return;
          status.style.display = 'block';
          if (name && email && message) {
            status.style.background = '#e0ffe0';
            status.style.color = '#2f9e44';
            status.textContent = '✅ Message sent successfully!';
            log('Form submitted successfully', 'ok');
          } else {
            status.style.background = '#ffe0e0';
            status.style.color = '#ff6b6b';
            status.textContent = '❌ Please fill all fields';
            log('Form validation failed', 'err');
          }
          break;
        }
        case 'resetPhysics()':
          resetPhysicsView();
          break;
        default:
          log(`Unhandled click action: ${action}`, 'err');
      }
    }

    function handleMiniKodeEvent(code) {
      log(`Event triggered: ${code}`, 'info');
    }

    function resetPhysicsView() {
      physicsEngine.clear();
      previewContent.innerHTML = '';
      log('Physics simulation reset', 'ok');
      setTimeout(() => runProgram(editor.value), 150);
    }

    function applyCommonParams(el, params) {
      for (const p of params) {
        const k = p.k;
        const v = p.v;
        switch (k) {
          case 'TEXT': el.textContent = v; break;
          case 'HTML': el.innerHTML = v; break;
          case 'STYLE': applyStyleFromString(el, v); break;
          case 'ATTR': applyAttrFromString(el, v); break;
          case 'CLASS': el.classList.add(...v.split(/\s+/).filter(Boolean)); break;
          case 'ID': el.id = v; break;
          case 'APPEND': {
            const parent = document.querySelector(v);
            if (!parent) throw new Error(`APPEND target not found: ${v}`);
            el.dataset.minikodeAppend = v;
            break;
          }
          case 'ONCLICK': el.addEventListener('click', () => handleMiniKodeClick(v)); break;
          case 'ONEVENT': {
            const idx = v.indexOf(':');
            if (idx === -1) throw new Error('ONEVENT requires event:code');
            const ev = v.slice(0, idx).trim();
            const code = v.slice(idx + 1).trim();
            if (!ev || !code) throw new Error('ONEVENT requires event:code');
            el.addEventListener(ev, () => handleMiniKodeEvent(code, el));
            break;
          }
          case 'DATA':
            for (const pair of v.split(/[;|]/).map(x => x.trim()).filter(Boolean)) {
              const eq = pair.indexOf('=');
              if (eq === -1) continue;
              el.dataset[pair.slice(0, eq).trim()] = pair.slice(eq + 1).trim();
            }
            break;
          case 'PHYSICS':
            el.dataset.minikodePhysics = v === '' ? 'true' : v;
            break;
          case 'VELOCITY':
            el.dataset.minikodeVelocity = v;
            break;
          case 'GRAVITY':
            physicsEngine.gravity = Number.parseFloat(v);
            if (Number.isNaN(physicsEngine.gravity)) throw new Error(`Invalid GRAVITY value: ${v}`);
            log(`Gravity set to ${physicsEngine.gravity}`, 'ok');
            break;
          case 'FRICTION':
            el.dataset.minikodeFriction = v;
            break;
          case 'BOUNCE':
            el.dataset.minikodeBounce = v;
            break;
          case 'VALUE':
            setElementValue(el, v);
            break;
          case 'PLACEHOLDER':
            el.placeholder = v;
            break;
          case 'DISABLED':
            el.disabled = /^true|1|yes$/i.test(v);
            break;
          case 'CHECKED':
            el.checked = /^true|1|yes$/i.test(v);
            break;
          case 'SRC':
            el.src = v;
            break;
          case 'ALT':
            el.alt = v;
            break;
          case 'TITLE':
            el.title = v;
            break;
          case 'SHOW':
            el.style.display = '';
            break;
          case 'HIDE':
            el.style.display = 'none';
            break;
          case 'TOGGLE':
            el.style.display = getComputedStyle(el).display === 'none' ? '' : 'none';
            break;
          case 'REMOVE':
            el.remove();
            break;
          case 'MOVE': {
            const [x, y] = v.split(/[,x]/).map(n => Number.parseFloat(n.trim()));
            el.style.position = 'absolute';
            if (!Number.isNaN(x)) el.style.left = `${x}px`;
            if (!Number.isNaN(y)) el.style.top = `${y}px`;
            previewContent.style.position = 'relative';
            break;
          }
          case 'RESIZE': {
            const [w, h] = v.split(/[,x]/).map(n => Number.parseFloat(n.trim()));
            if (!Number.isNaN(w)) el.style.width = `${w}px`;
            if (!Number.isNaN(h)) el.style.height = `${h}px`;
            break;
          }
          case 'FOCUS':
            el.focus?.();
            break;
          case 'BLUR':
            el.blur?.();
            break;
          case 'STORE':
            localStorage.setItem(el.id || 'minikode', v);
            break;
          case 'LOAD':
            el.textContent = localStorage.getItem(v) || '';
            break;
          default:
            throw new Error(`Unknown parameter ${k}`);
        }
      }
    }

    function createFromBlock(parsed) {
      const { thing, position, size, paramsRaw } = parsed;
      const { tag, id, classes } = parseShorthand(thing);
      const el = document.createElement(tag || 'div');

      if (id) el.id = id;
      if (classes.length) el.className = classes.join(' ');

      let appendTo = previewContent;

      if (position) {
        const pos = position.trim();
        if (/^[#.]/.test(pos)) {
          const parent = document.querySelector(pos);
          if (!parent) throw new Error(`Parent not found: ${pos}`);
          appendTo = parent;
        } else if (/^\d+\s*[,x]\s*\d+$/.test(pos)) {
          const [x, y] = pos.split(/[ ,x]/).map(s => s.trim());
          el.style.position = 'absolute';
          el.style.left = `${parseFloat(x)}px`;
          el.style.top = `${parseFloat(y)}px`;
          previewContent.style.position = 'relative';
        } else if (pos.includes(':')) {
          applyStyleFromString(el, pos);
        } else {
          throw new Error(`Invalid position syntax: ${pos}`);
        }
      }

      if (size) {
        const s = size.trim();
        if (!s || s === '[]') {
          // no size
        } else if (/^\d+\s*[x,]\s*\d+$/.test(s)) {
          const [w, h] = s.split(/[x,]/).map(x => x.trim());
          el.style.width = `${w}px`;
          el.style.height = `${h}px`;
        } else if (/^\d+(\.\d+)?(px|%|vw|vh|rem|em|vmin|vmax)$/.test(s)) {
          el.style.width = s;
        } else if (/^\d+(\.\d+)?\s*[x,]\s*\d+(\.\d+)?(px|%|vw|vh|rem|em|vmin|vmax)?$/.test(s)) {
          const sep = s.includes('x') ? 'x' : ',';
          const [w, h] = s.split(sep).map(x => x.trim());
          el.style.width = /^\d+(\.\d+)?$/.test(w) ? `${w}px` : w;
          el.style.height = /^\d+(\.\d+)?$/.test(h) ? `${h}px` : h;
        } else if (s.includes(':')) {
          applyStyleFromString(el, s);
        } else {
          throw new Error(`Invalid size syntax: ${s}`);
        }
      }

      const { params, errors } = parseParamsStrict(paramsRaw);
      if (errors.length) throw new Error(errors[0]);
      applyCommonParams(el, params);

      appendTo.appendChild(el);

      requestAnimationFrame(() => {
        try {
          ensureVisible(el);
          if (el.dataset.minikodePhysics === 'true') {
            const cfg = {};
            if (el.dataset.minikodeFriction) cfg.friction = Number.parseFloat(el.dataset.minikodeFriction);
            if (el.dataset.minikodeBounce) cfg.bounce = Number.parseFloat(el.dataset.minikodeBounce);
            physicsEngine.addObject(el, cfg);
            physicsEngine.start();
            if (el.dataset.minikodeVelocity) {
              const [vx, vy] = el.dataset.minikodeVelocity.split(/[,x]/).map(v => Number.parseFloat(v.trim()));
              if (!Number.isNaN(vx) && !Number.isNaN(vy)) physicsEngine.applyVelocity(el, vx, vy);
            }
            log(`✓ Physics enabled for #${el.id || thing}`, 'ok');
          }
        } catch (err) {
          log(`Post-create error: ${err.message || err}`, 'err');
        }
      });

      runtime.elements.set(id || thing, el);
      runtime.commandCount += 1;
    }

    const physicsEngine = {
      objects: [],
      gravity: 0.5,
      friction: 0.98,
      bounce: 0.7,
      running: false,

      addObject(el, cfg) {
        this.objects.push({
          el,
          vx: 0,
          vy: 0,
          friction: cfg.friction ?? this.friction,
          bounce: cfg.bounce ?? this.bounce,
        });
      },

      applyVelocity(el, vx, vy) {
        const obj = this.objects.find(o => o.el === el);
        if (obj) {
          obj.vx = vx;
          obj.vy = vy;
        }
      },

      start() {
        if (this.running) return;
        this.running = true;
        this.animate();
      },

      stop() {
        this.running = false;
      },

      clear() {
        this.objects = [];
        this.running = false;
      },

      animate() {
        if (!this.running || this.objects.length === 0) return;

        const bounds = previewContent.getBoundingClientRect();
        const maxX = bounds.width;
        const maxY = bounds.height;

        for (const obj of this.objects) {
          const el = obj.el;
          const rect = el.getBoundingClientRect();
          const containerRect = previewContent.getBoundingClientRect();

          let x = rect.left - containerRect.left;
          let y = rect.top - containerRect.top;
          let w = rect.width;
          let h = rect.height;

          obj.vy += this.gravity;
          obj.vx *= obj.friction;
          obj.vy *= obj.friction;

          x += obj.vx;
          y += obj.vy;

          if (x < 0) {
            x = 0;
            obj.vx *= -obj.bounce;
          }
          if (x + w > maxX) {
            x = maxX - w;
            obj.vx *= -obj.bounce;
          }
          if (y < 0) {
            y = 0;
            obj.vy *= -obj.bounce;
          }
          if (y + h > maxY) {
            y = maxY - h;
            obj.vy *= -obj.bounce;
          }

          el.style.left = `${x}px`;
          el.style.top = `${y}px`;
        }

        requestAnimationFrame(() => this.animate());
      }
    };

    function runProgram(code) {
      clearConsole();
      runtime.errors = 0;
      runtime.commandCount = 0;
      previewContent.innerHTML = '';
      physicsEngine.clear();
      updateStatistics();

      const program = extractProgram(code);
      if (!program) {
        log('Program must be wrapped in <BMK>...</BMK>', 'err');
        return;
      }

      const blocks = extractBlocksWithLines(program);
      if (!blocks.length) {
        log('No blocks found', 'err');
        return;
      }

      for (const block of blocks) {
        try {
          const { error, parsed } = parseBlockTextStrict(block.text);
          if (error) {
            syntaxError(block.line, error, block.text.slice(0, 40));
            continue;
          }
          createFromBlock(parsed);
        } catch (err) {
          syntaxError(block.line, err.message || err, block.text.slice(0, 40));
        }
      }

      log(`✓ Execution complete: ${runtime.commandCount} commands, ${runtime.errors} errors`, 'ok');
      updateStatistics();
    }

    function formatCode() {
      const code = editor.value;
      const program = extractProgram(code);
      if (!program) {
        log('Invalid program format', 'err');
        return;
      }
      const blocks = extractBlocksWithLines(program);
      const formatted = blocks.map(b => `<BL ${b.text} EL>`).join('\n');
      editor.value = `<BMK>\n${formatted}\n<EMK>`;
      log('Code formatted', 'ok');
    }

    function lintCode() {
      clearConsole();
      const code = editor.value;
      const program = extractProgram(code);
      if (!program) {
        log('Invalid: must be wrapped in <BMK>...</BMK>', 'err');
        return;
      }
      const blocks = extractBlocksWithLines(program);
      let issues = 0;
      for (const block of blocks) {
        const { error, parsed } = parseBlockTextStrict(block.text);
        if (error) {
          log(`Line ${block.line}: ${error}`, 'err');
          issues += 1;
          continue;
        }
        const { params, errors } = parseParamsStrict(parsed.paramsRaw);
        if (errors.length) {
          log(`Line ${block.line}: ${errors[0]}`, 'err');
          issues += 1;
        }
      }
      if (issues === 0) {
        log('✓ No linting issues found', 'ok');
      } else {
        log(`✓ Found ${issues} issue(s)`, 'info');
      }
    }

    // Event Listeners
    runBtn.addEventListener('click', () => runProgram(editor.value));
    clearBtn.addEventListener('click', () => {
      editor.value = '';
      clearConsole();
      previewContent.innerHTML = '';
      physicsEngine.clear();
      updateStatistics();
    });
    formatBtn.addEventListener('click', formatCode);
    lintBtn.addEventListener('click', lintCode);

    editor.addEventListener('input', updateStatistics);
    editor.addEventListener('keydown', (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
        runProgram(editor.value);
      }
    });

    document.querySelectorAll('.template-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const tmpl = btn.dataset.template;
        if (templates[tmpl]) {
          editor.value = templates[tmpl];
          updateStatistics();
          log(`Template "${tmpl}" loaded`, 'ok');
        }
      });
    });

    log('MiniKode.Builder ready 🚀', 'ok');
    updateStatistics();
  </script>
</body>
</html>
