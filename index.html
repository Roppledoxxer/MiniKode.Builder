<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MiniKode.Builder — MiniKode 2.1</title>
<style>
  *{box-sizing:border-box}
  :root{
    --bg:#07101f;--panel:#0d1729;--panel2:#111e34;--line:#22314b;
    --text:#e8eef7;--muted:#8fa0b8;--accent:#63e6be;--accent2:#4dabf7;
    --danger:#ff6b6b;--warn:#ffd43b;--ok:#69db7c;
  }
  html,body{height:100%;margin:0}
  body{
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
    background:radial-gradient(circle at top,#10203b 0,#07101f 45%,#050b14 100%);
    color:var(--text);overflow:auto
  }
  button,textarea{font:inherit}
  .app{min-height:100vh;height:100vh;display:grid;grid-template-rows:auto minmax(0,1fr)}
  header{
    display:flex;align-items:center;justify-content:space-between;gap:16px;
    padding:12px 16px;border-bottom:1px solid var(--line);
    background:rgba(5,11,20,.82);backdrop-filter:blur(12px)
  }
  .brand{display:flex;align-items:center;gap:10px}
  .brand h1{font-size:16px;margin:0;color:var(--accent)}
  .badge{font-size:10px;color:#9ae6ff;border:1px solid #24506d;padding:3px 7px;border-radius:999px}
  .stats{display:flex;gap:16px;color:var(--muted);font-size:10px}
  .stats b{color:var(--text)}
  main{
    min-height:0;display:grid;grid-template-columns:minmax(360px,1.05fr) minmax(420px,.95fr);
    gap:12px;padding:12px
  }
  .panel{
    min-height:0;background:rgba(13,23,41,.84);border:1px solid var(--line);
    border-radius:12px;display:flex;flex-direction:column;overflow:hidden
  }
  .panel-head{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:9px 11px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.02)
  }
  .panel-title{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--accent)}
  .toolbar{display:flex;gap:7px;flex-wrap:wrap}
  button{
    border:1px solid #2b4a64;background:#102238;color:#bdebdc;border-radius:7px;
    padding:7px 10px;font-size:10px;cursor:pointer;transition:.15s
  }
  button:hover{transform:translateY(-1px);border-color:#3a6985;background:#15304a}
  button.primary{background:#123b33;border-color:#2b8a70;color:#b8f7e7}
  button.danger{background:#351b22;border-color:#703340;color:#ffb0b0}
  button.ghost{background:transparent}
  .editor-wrap{flex:1;min-height:0;position:relative}
  textarea{
    width:100%;height:100%;resize:none;outline:0;border:0;background:#08111e;color:#dce7f3;
    padding:14px 16px;line-height:1.55;font-size:12px;tab-size:2;white-space:pre;overflow:auto
  }
  textarea:focus{box-shadow:inset 0 0 0 1px rgba(99,230,190,.2)}
  .bottom{
    display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:10px;border-top:1px solid var(--line)
  }
  .box{
    min-width:0;background:#091322;border:1px solid var(--line);border-radius:8px;padding:9px
  }
  .box h3{font-size:10px;margin:0 0 7px;color:#9eb0c7;text-transform:uppercase}
  .templates{display:flex;gap:6px;flex-wrap:wrap}
  .templates button{flex:1;min-width:70px}
  .hint{font-size:10px;line-height:1.55;color:var(--muted);max-height:95px;overflow:auto}
  .preview{min-height:0;display:flex;flex-direction:column}
  .preview-frame{flex:1;min-height:0;background:#fff;overflow:auto;position:relative}
  .console{height:170px;display:flex;flex-direction:column}
  .log{
    flex:1;overflow:auto;padding:10px;background:#06101b;color:#8fa0b8;font-size:10px;line-height:1.55
  }
  .entry{padding:3px 0 3px 7px;border-left:2px solid #354156;margin-bottom:5px}
  .entry.ok{border-color:#2f9e44;color:#8ce99a}
  .entry.err{border-color:#e03131;color:#ff8787}
  .entry.warn{border-color:#f08c00;color:#ffd43b}
  .status-dot{width:8px;height:8px;border-radius:50%;background:var(--ok);display:inline-block}
  @media(max-width:980px){body{overflow:auto}.app{height:auto;min-height:100vh}main{grid-template-columns:1fr;grid-template-rows:minmax(560px,auto) minmax(560px,70vh)}.bottom{grid-template-columns:1fr}.console{height:150px}.stats{gap:8px;flex-wrap:wrap;justify-content:flex-end}}
  @media(max-width:560px){header{align-items:flex-start;flex-direction:column}.stats{justify-content:flex-start}main{padding:8px;gap:8px}.toolbar button{padding:7px 8px}.panel-head{align-items:flex-start;flex-wrap:wrap}}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <span class="status-dot"></span>
      <h1>MiniKode.Builder</h1>
      <span class="badge">MiniKode 2.1</span>
    </div>
    <div class="stats">
      <span>Lines <b id="lineCount">0</b></span>
      <span>Chars <b id="charCount">0</b></span>
      <span>Commands <b id="commandCount">0</b></span>
      <span>Errors <b id="errorCount">0</b></span>
    </div>
  </header>

  <main>
    <section class="panel">
      <div class="panel-head">
        <span class="panel-title">Editor</span>
        <div class="toolbar">
          <button class="primary" id="runBtn">▶ Run</button>
          <button id="formatBtn">✦ Format</button>
          <button id="saveBtn">💾 Save</button>
          <button id="loadBtn">↶ Load</button>
          <button onclick="window.location.href='tutorial/tutorial.html'">Tutorial & Help</button>
          <button class="danger" id="clearBtn">Clear</button>
        </div>
      </div>

      <div class="editor-wrap">
        <textarea id="editor" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off"></textarea>
      </div>

      <div class="bottom">
        <div class="box">
          <h3>Quick Templates</h3>
          <div class="templates">
            <button data-template="hello">Hello</button>
            <button data-template="counter">Counter</button>
            <button data-template="todo">Todo</button>
            <button data-template="cards">Cards</button>
            <button data-template="physics">Physics</button>
          </div>
        </div>
        <div class="box">
          <h3>MiniKode Syntax</h3>
          <div class="hint" id="hint"></div>
        </div>
      </div>
    </section>

    <section class="preview">
      <div class="panel" style="flex:1">
        <div class="panel-head">
          <span class="panel-title">Live Preview</span>
          <button class="ghost" id="refreshBtn">↻ Refresh</button>
        </div>
        <div class="preview-frame" id="preview"></div>
      </div>
      <div class="panel console">
        <div class="panel-head"><span class="panel-title">Console</span><button class="ghost" id="consoleClear">Clear</button></div>
        <div class="log" id="console"></div>
      </div>
    </section>
  </main>
</div>

<script>
"use strict";

/*
  MiniKode 2.1
  A small, browser-based language for building simple interfaces and demos.
  The expression parser is deliberately limited: it does not execute JavaScript.
*/

const $ = (selector, root = document) => root.querySelector(selector);

const runtime = {
  vars: Object.create(null),
  elements: new Map(),
  cleanup: [],
  physics: new Map(),
  errors: 0,
  commands: 0,
  running: false
};

const refs = {
  editor: $("#editor"),
  preview: $("#preview"),
  console: $("#console"),
  lineCount: $("#lineCount"),
  charCount: $("#charCount"),
  commandCount: $("#commandCount"),
  errorCount: $("#errorCount"),
  hint: $("#hint")
};

function log(message, type = "info") {
  const row = document.createElement("div");
  row.className = `entry ${type}`;
  row.textContent = String(message);
  refs.console.appendChild(row);
  refs.console.scrollTop = refs.console.scrollHeight;
}

function clearRuntime() {
  if (typeof physics !== "undefined") physics.stop();
  for (const cleanup of runtime.cleanup.splice(0)) {
    try { cleanup(); } catch (error) { console.warn("MiniKode cleanup:", error); }
  }
  runtime.elements.clear();
  runtime.physics.clear();
  runtime.vars = Object.create(null);
  refs.preview.replaceChildren();
}

function stats() {
  const code = refs.editor.value;
  refs.lineCount.textContent = code ? code.split(/\r?\n/).length : 0;
  refs.charCount.textContent = code.length;
  try {
    refs.commandCount.textContent = normalizeLines(code).length;
  } catch {
    refs.commandCount.textContent = 0;
  }
  refs.errorCount.textContent = runtime.errors;
}

/* ---------- source helpers ---------- */

function stripComments(code) {
  return String(code).split(/\r?\n/).map(line => {
    let quote = null;
    let escaped = false;
    for (let i = 0; i < line.length - 1; i++) {
      const char = line[i];
      if (escaped) { escaped = false; continue; }
      if (char === "\\") { escaped = true; continue; }
      if (quote) {
        if (char === quote) quote = null;
        continue;
      }
      if (char === "\"" || char === "'") { quote = char; continue; }
      if (char === "/" && line[i + 1] === "/" && (i === 0 || /\s/.test(line[i - 1]))) {
        return line.slice(0, i);
      }
    }
    return line;
  }).join("\n");
}

function splitTopLevel(source, separators = ",;") {
  const output = [];
  let start = 0;
  let quote = null;
  let depth = 0;
  let escaped = false;

  for (let i = 0; i < source.length; i++) {
    const char = source[i];
    if (escaped) { escaped = false; continue; }
    if (char === "\\") { escaped = true; continue; }
    if (quote) {
      if (char === quote) quote = null;
      continue;
    }
    if (char === "\"" || char === "'") { quote = char; continue; }
    if (char === "(" || char === "[" || char === "{") depth++;
    else if (char === ")" || char === "]" || char === "}") depth = Math.max(0, depth - 1);
    else if (depth === 0 && separators.includes(char)) {
      const piece = source.slice(start, i).trim();
      if (piece) output.push(piece);
      start = i + 1;
    }
  }

  const last = source.slice(start).trim();
  if (last) output.push(last);
  return output;
}

function normalizeLines(code) {
  const source = stripComments(String(code).replace(/^\uFEFF/, ""));
  const rawLines = source.split(/\r?\n/);
  const output = [];
  let buffer = "";
  let depth = 0;
  let quote = null;
  let escaped = false;
  let continued = false;

  for (const rawLine of rawLines) {
    const trimmed = rawLine.trim();
    if (!trimmed && depth === 0 && !buffer) continue;
    if (!buffer && (trimmed.toUpperCase() === "BMK" || trimmed.toUpperCase() === "EMK")) continue;

    let line = trimmed;
    const hasContinuation = /\\$/.test(line);
    if (hasContinuation) line = line.slice(0, -1).trimEnd();

    if (buffer) buffer += depth > 0 ? "\n" : " ";
    buffer += line;

    for (let i = 0; i < line.length; i++) {
      const char = line[i];
      if (escaped) { escaped = false; continue; }
      if (char === "\\") { escaped = true; continue; }
      if (quote) {
        if (char === quote) quote = null;
        continue;
      }
      if (char === "\"" || char === "'") { quote = char; continue; }
      if (char === "{") depth++;
      else if (char === "}") depth--;
      if (depth < 0) throw new Error("Found a closing '}' without a matching '{'.");
    }

    continued = hasContinuation;
    if (depth === 0 && !continued) {
      if (buffer.trim()) output.push(buffer.trim());
      buffer = "";
      quote = null;
      escaped = false;
    }
  }

  if (buffer.trim()) output.push(buffer.trim());
  return output;
}

function parseQuoted(value) {
  const input = value.trim();
  if (input.length < 2 || !((input[0] === '"' && input.at(-1) === '"') || (input[0] === "'" && input.at(-1) === "'"))) {
    return input;
  }

  const quote = input[0];
  const inner = input.slice(1, -1);
  let result = "";
  let escaped = false;
  const escapeMap = { n: "\n", r: "\r", t: "\t", b: "\b", f: "\f" };

  for (const char of inner) {
    if (escaped) {
      result += Object.prototype.hasOwnProperty.call(escapeMap, char) ? escapeMap[char] : char;
      escaped = false;
    } else if (char === "\\") {
      escaped = true;
    } else {
      result += char;
    }
  }
  if (escaped) result += "\\";
  return result;
}

/* ---------- variables and interpolation ---------- */

function getPathValue(path) {
  const parts = String(path).split(".");
  let value = runtime.vars[parts.shift()];
  for (const part of parts) {
    if (["__proto__", "prototype", "constructor"].includes(part)) return undefined;
    if (value == null) return undefined;
    value = value[part];
  }
  return value;
}

function readElementProperty(reference, property) {
  const element = resolveElement(reference);
  if (!element) return undefined;
  const properties = {
    value: "value",
    text: "textContent",
    textcontent: "textContent",
    checked: "checked",
    disabled: "disabled",
    hidden: "hidden",
    title: "title",
    id: "id",
    class: "className"
  };
  const key = properties[property.toLowerCase()];
  return key ? element[key] : undefined;
}

function getValuePath(path) {
  const value = String(path).trim();
  const elementMatch = value.match(/^([#.][\w-]+)\.(value|text|textContent|checked|disabled|hidden|title|id|class)$/i);
  if (elementMatch) return readElementProperty(elementMatch[1], elementMatch[2]);
  return getPathValue(value);
}

function interpolate(value) {
  return String(value).replace(/\{\{\s*([#.]?[a-zA-Z_$][\w$.-]*)\s*\}\}/g, (_match, path) => {
    const result = getValuePath(path);
    return result == null ? "" : String(result);
  });
}

function resolveValue(raw) {
  const value = String(raw ?? "").trim();
  if (!value) return "";

  const isQuoted = (value[0] === '"' && value.at(-1) === '"') || (value[0] === "'" && value.at(-1) === "'");
  if (isQuoted) return interpolate(parseQuoted(value));
  if (value === "true") return true;
  if (value === "false") return false;
  if (value === "null") return null;
  if (value === "undefined") return undefined;
  if (/^-?(?:\d+\.?\d*|\.\d+)$/.test(value)) return Number(value);
  if (value.startsWith("expr(") && value.endsWith(")")) return evaluate(value.slice(5, -1));
  if (value.startsWith("json(") && value.endsWith(")")) {
    try { return JSON.parse(value.slice(5, -1)); }
    catch (error) { throw new Error(`Invalid JSON value: ${error.message}`); }
  }

  if (/^([#.][\w-]+)\.(value|text|textContent|checked|disabled|hidden|title|id|class)$/i.test(value)) {
    const result = getValuePath(value);
    return result === undefined ? "" : result;
  }
  if (/^[a-zA-Z_$][\w$]*(?:\.[a-zA-Z_$][\w$]*)*$/.test(value)) {
    const result = getPathValue(value);
    if (result !== undefined) return result;
  }
  return interpolate(value);
}

/* ---------- safe expression parser (no eval / Function) ---------- */

function tokenizeExpression(source) {
  const tokens = [];
  let i = 0;
  const text = String(source);

  while (i < text.length) {
    if (/\s/.test(text[i])) { i++; continue; }

    const rest = text.slice(i);
    const number = rest.match(/^(?:\d+\.?\d*|\.\d+)(?:[eE][+-]?\d+)?/);
    if (number) {
      tokens.push({ type: "number", value: Number(number[0]) });
      i += number[0].length;
      continue;
    }

    if (text[i] === '"' || text[i] === "'") {
      const quote = text[i];
      let end = i + 1;
      let escaped = false;
      for (; end < text.length; end++) {
        const char = text[end];
        if (escaped) { escaped = false; continue; }
        if (char === "\\") { escaped = true; continue; }
        if (char === quote) break;
      }
      if (end >= text.length) throw new Error("Unclosed string in expression.");
      tokens.push({ type: "string", value: parseQuoted(text.slice(i, end + 1)) });
      i = end + 1;
      continue;
    }

    const identifier = rest.match(/^[a-zA-Z_$][\w$]*(?:\.[a-zA-Z_$][\w$]*)*/);
    if (identifier) {
      const word = identifier[0];
      if (word === "true") tokens.push({ type: "literal", value: true });
      else if (word === "false") tokens.push({ type: "literal", value: false });
      else if (word === "null") tokens.push({ type: "literal", value: null });
      else if (word === "undefined") tokens.push({ type: "literal", value: undefined });
      else tokens.push({ type: "identifier", value: word });
      i += word.length;
      continue;
    }

    const operator = rest.match(/^(===|!==|==|!=|<=|>=|&&|\|\||[()+\-*/%<>!])/);
    if (operator) {
      tokens.push({ type: "operator", value: operator[0] });
      i += operator[0].length;
      continue;
    }

    throw new Error(`Unexpected character '${text[i]}' in expression.`);
  }

  return tokens;
}

function evaluate(source) {
  const tokens = tokenizeExpression(source);
  let position = 0;
  const peek = () => tokens[position];
  const take = value => {
    if (peek()?.value === value) { position++; return true; }
    return false;
  };
  const expect = value => {
    if (!take(value)) throw new Error(`Expected '${value}' in expression.`);
  };

  function primary() {
    const token = peek();
    if (!token) throw new Error("Incomplete expression.");
    if (take("(")) {
      const result = logicalOr();
      expect(")");
      return result;
    }
    position++;
    if (token.type === "number" || token.type === "string" || token.type === "literal") return token.value;
    if (token.type === "identifier") return getPathValue(token.value);
    throw new Error(`Unexpected '${token.value}' in expression.`);
  }

  function unary() {
    if (take("!")) return !unary();
    if (take("-")) return -Number(unary());
    if (take("+")) return Number(unary());
    return primary();
  }

  function multiplicative() {
    let value = unary();
    while (["*", "/", "%"].includes(peek()?.value)) {
      const operator = tokens[position++].value;
      const right = unary();
      if (operator === "*") value = Number(value) * Number(right);
      else if (operator === "/") value = Number(value) / Number(right);
      else value = Number(value) % Number(right);
    }
    return value;
  }

  function additive() {
    let value = multiplicative();
    while (["+", "-"].includes(peek()?.value)) {
      const operator = tokens[position++].value;
      const right = multiplicative();
      if (operator === "+") value = typeof value === "string" || typeof right === "string" ? String(value ?? "") + String(right ?? "") : Number(value) + Number(right);
      else value = Number(value) - Number(right);
    }
    return value;
  }

  function comparison() {
    let value = additive();
    while (["<", ">", "<=", ">="].includes(peek()?.value)) {
      const operator = tokens[position++].value;
      const right = additive();
      if (operator === "<") value = value < right;
      else if (operator === ">") value = value > right;
      else if (operator === "<=") value = value <= right;
      else value = value >= right;
    }
    return value;
  }

  function equality() {
    let value = comparison();
    while (["==", "===", "!=", "!=="].includes(peek()?.value)) {
      const operator = tokens[position++].value;
      const right = comparison();
      if (operator === "==" || operator === "===") value = value === right || (operator === "==" && value == right); // intentional loose comparison for ==
      else value = !(value === right || (operator === "!=" && value == right));
    }
    return value;
  }

  function logicalAnd() {
    let value = equality();
    while (take("&&")) {
      const right = equality();
      value = Boolean(value) && Boolean(right);
    }
    return value;
  }

  function logicalOr() {
    let value = logicalAnd();
    while (take("||")) {
      const right = logicalAnd();
      value = Boolean(value) || Boolean(right);
    }
    return value;
  }

  const result = logicalOr();
  if (position !== tokens.length) throw new Error(`Unexpected '${tokens[position].value}' at end of expression.`);
  return result;
}

/* ---------- selectors and element creation ---------- */

function parseTarget(target) {
  const name = String(target).trim();
  if (name === "preview" || name === "root") return refs.preview;
  if (name === "body") return document.body;
  if (runtime.elements.has(name)) return runtime.elements.get(name);
  try { return document.querySelector(name); }
  catch { return null; }
}

function parseElementSpec(spec) {
  const match = String(spec).trim().match(/^([a-zA-Z][\w-]*)(#[\w-]+)?((?:\.[\w-]+)*)$/);
  if (!match) throw new Error(`Invalid element '${spec}'. Use a tag, optional #id, and optional .classes.`);
  return {
    tag: match[1],
    id: match[2] ? match[2].slice(1) : "",
    classes: match[3] ? match[3].split(".").filter(Boolean) : []
  };
}

function extractBraced(source) {
  const open = source.indexOf("{");
  if (open < 0) return { head: source.trim(), body: "" };

  let depth = 0;
  let quote = null;
  let escaped = false;
  let close = -1;
  for (let i = open; i < source.length; i++) {
    const char = source[i];
    if (escaped) { escaped = false; continue; }
    if (char === "\\") { escaped = true; continue; }
    if (quote) {
      if (char === quote) quote = null;
      continue;
    }
    if (char === '"' || char === "'") { quote = char; continue; }
    if (char === "{") depth++;
    else if (char === "}") {
      depth--;
      if (depth === 0) { close = i; break; }
    }
  }
  if (close < 0) throw new Error("Unclosed '{...}' parameter block.");
  if (source.slice(close + 1).trim()) throw new Error("Unexpected text after the closing '}' in create command.");
  return { head: source.slice(0, open).trim(), body: source.slice(open + 1, close).trim() };
}

function parseCreate(line) {
  const { head, body } = extractBraced(line);
  const match = head.match(/^create\s+(\S+)(?:\s+(?:->|@)\s*(\S+))?(?:\s+\[([^\]]*)\])?\s*$/i);
  if (!match) throw new Error("Use: create tag#id.class -> target [widthxheight] { ... }");
  return {
    spec: match[1],
    target: match[2] || "preview",
    size: match[3] || "",
    params: parseParams(body)
  };
}

function parseParams(body) {
  if (!body) return {};
  const output = Object.create(null);
  for (const part of splitTopLevel(body, ",;\n")) {
    const colon = part.indexOf(":");
    if (colon < 0) {
      output.text = resolveValue(part);
      continue;
    }
    const key = part.slice(0, colon).trim().toLowerCase();
    if (!/^[a-z][a-z0-9_-]*$/.test(key)) throw new Error(`Invalid parameter name '${key}'.`);
    output[key] = resolveValue(part.slice(colon + 1).trim());
  }
  return output;
}

function applySize(element, size) {
  if (!size) return;
  const parts = size.split(/[x,]/).map(part => part.trim());
  if (parts[0]) element.style.width = /^-?\d+(?:\.\d+)?$/.test(parts[0]) ? `${parts[0]}px` : parts[0];
  if (parts[1]) element.style.height = /^-?\d+(?:\.\d+)?$/.test(parts[1]) ? `${parts[1]}px` : parts[1];
}

function applyStyle(element, value) {
  const source = String(value ?? "");
  for (const rule of splitTopLevel(source, ";")) {
    const colon = rule.indexOf(":");
    if (colon < 0) continue;
    const originalProperty = rule.slice(0, colon).trim();
    const propertyValue = interpolate(rule.slice(colon + 1).trim());
    if (!originalProperty) continue;
    if (originalProperty.startsWith("--")) element.style.setProperty(originalProperty, propertyValue);
    else {
      const property = originalProperty.replace(/-([a-z])/g, (_match, char) => char.toUpperCase());
      element.style[property] = propertyValue;
    }
  }
}

function applyAttrs(element, value) {
  for (const pair of splitTopLevel(String(value ?? ""), ";|,")) {
    const equals = pair.indexOf("=");
    if (equals < 0) {
      const name = pair.trim();
      if (name) element.setAttribute(name, "");
      continue;
    }
    const name = pair.slice(0, equals).trim();
    const rawValue = pair.slice(equals + 1).trim();
    if (!/^[a-zA-Z_:][\w:.-]*$/.test(name)) throw new Error(`Invalid attribute name '${name}'.`);
    const attrValue = interpolate(parseQuoted(rawValue));
    element.setAttribute(name, attrValue);
  }
}

function remember(element, key) {
  if (key) runtime.elements.set(key, element);
  if (element.id) runtime.elements.set(`#${element.id}`, element);
}

function createElement(line) {
  const config = parseCreate(line);
  const spec = parseElementSpec(config.spec);
  const target = parseTarget(config.target);
  if (!target) throw new Error(`Target '${config.target}' was not found.`);

  const element = document.createElement(spec.tag);
  if (spec.id) element.id = spec.id;
  if (spec.classes.length) element.classList.add(...spec.classes);
  applySize(element, config.size);

  const params = config.params;
  if (Object.prototype.hasOwnProperty.call(params, "text")) element.textContent = String(params.text ?? "");
  if (Object.prototype.hasOwnProperty.call(params, "html")) element.innerHTML = String(params.html ?? "");
  if (Object.prototype.hasOwnProperty.call(params, "style")) applyStyle(element, params.style);
  if (Object.prototype.hasOwnProperty.call(params, "attr")) applyAttrs(element, params.attr);
  if (Object.prototype.hasOwnProperty.call(params, "class")) {
    const classes = String(params.class ?? "").split(/\s+/).filter(Boolean);
    if (classes.length) element.classList.add(...classes);
  }
  if (Object.prototype.hasOwnProperty.call(params, "value") && "value" in element) element.value = String(params.value ?? "");
  if (Object.prototype.hasOwnProperty.call(params, "placeholder")) element.setAttribute("placeholder", String(params.placeholder ?? ""));
  if (Object.prototype.hasOwnProperty.call(params, "src")) element.setAttribute("src", String(params.src ?? ""));
  if (params.hidden === true) element.hidden = true;

  target.appendChild(element);
  remember(element, spec.id ? `#${spec.id}` : config.spec);

  if (params.onclick != null) bind(element, "click", String(params.onclick));
  if (params.oninput != null) bind(element, "input", String(params.oninput));
  if (params.onchange != null) bind(element, "change", String(params.onchange));
  if (params.onkeydown != null) bind(element, "keydown", String(params.onkeydown));
  if (params.event != null) {
    const eventMatch = String(params.event).match(/^(\w+)\s*=>\s*(.*)$/s);
    if (!eventMatch) throw new Error("event expects: eventName => MiniKode statements");
    bind(element, eventMatch[1], eventMatch[2]);
  }
  if (Object.prototype.hasOwnProperty.call(params, "physics") && params.physics !== false) addPhysics(element, params);
  return element;
}

function bind(element, eventName, code) {
  const handler = event => {
    try {
      executeStatements(code, event, element);
    } catch (error) {
      runtime.errors++;
      log(`Event error: ${error.message}`, "err");
      stats();
    }
  };
  element.addEventListener(eventName, handler);
  runtime.cleanup.push(() => element.removeEventListener(eventName, handler));
}

function resolveElement(reference) {
  const name = String(reference).trim();
  if (name === "$event") return runtime.vars.$event?.target || null;
  if (name === "$self") return runtime.vars.$self || null;
  if (runtime.elements.has(name)) return runtime.elements.get(name);
  return parseTarget(name);
}

function requireElement(reference) {
  const element = resolveElement(reference);
  if (!element) throw new Error(`Element '${reference}' was not found.`);
  return element;
}

/* ---------- statements ---------- */

function executeStatement(statement, event = null, self = null) {
  const source = statement.trim();
  if (!source) return;
  let match;

  if (/^create\s+/i.test(source)) {
    createElement(source);
    return;
  }

  if (/^let\s+/i.test(source)) {
    match = source.match(/^let\s+([A-Za-z_$][\w$]*)\s*=\s*(.*)$/i);
    if (!match) throw new Error("Use: let variableName = value");
    runtime.vars[match[1]] = resolveValue(match[2]);
    return;
  }

  if (/^set\s+/i.test(source)) {
    match = source.match(/^set\s+(\S+)\s+(text|html|value|style|attr|class|prop)\s*(?:=|\s)\s*(.*)$/i);
    if (!match) throw new Error("Use: set #id text \"Hello\"");
    const element = requireElement(match[1]);
    const kind = match[2].toLowerCase();
    const raw = match[3];
    if (kind === "prop") {
      const equals = raw.indexOf("=");
      if (equals < 1) throw new Error("prop expects: set #id prop propertyName=value");
      const property = raw.slice(0, equals).trim();
      if (["__proto__", "prototype", "constructor", "outerHTML", "innerHTML"].includes(property)) {
        throw new Error(`Changing '${property}' through prop is not allowed.`);
      }
      element[property] = resolveValue(raw.slice(equals + 1));
      return;
    }
    const value = resolveValue(raw);
    if (kind === "text") element.textContent = String(value ?? "");
    else if (kind === "html") element.innerHTML = String(value ?? "");
    else if (kind === "value") element.value = value ?? "";
    else if (kind === "style") applyStyle(element, value);
    else if (kind === "attr") applyAttrs(element, value);
    else if (kind === "class") element.className = String(value ?? "");
    return;
  }

  if (/^show\s+/i.test(source)) { requireElement(source.replace(/^show\s+/i, "")).hidden = false; return; }
  if (/^hide\s+/i.test(source)) { requireElement(source.replace(/^hide\s+/i, "")).hidden = true; return; }
  if (/^toggle\s+/i.test(source)) {
    const element = requireElement(source.replace(/^toggle\s+/i, ""));
    element.hidden = !element.hidden;
    return;
  }
  if (/^remove\s+/i.test(source)) { requireElement(source.replace(/^remove\s+/i, "")).remove(); return; }

  if (/^addclass\s+/i.test(source) || /^delclass\s+/i.test(source)) {
    match = source.match(/^(addclass|delclass)\s+(\S+)\s+(.+)$/i);
    if (!match) throw new Error("Use: addclass #id className (or delclass)");
    const element = requireElement(match[2]);
    const classes = String(resolveValue(match[3])).split(/\s+/).filter(Boolean);
    if (classes.length) {
      if (match[1].toLowerCase() === "addclass") element.classList.add(...classes);
      else element.classList.remove(...classes);
    }
    return;
  }

  if (/^log\s*/i.test(source)) { log(String(resolveValue(source.replace(/^log\s*/i, ""))), "info"); return; }
  if (/^alert\s*/i.test(source)) { window.alert(String(resolveValue(source.replace(/^alert\s*/i, "")))); return; }

  if (/^wait\s+/i.test(source)) {
    match = source.match(/^wait\s+(\d+)\s*=>\s*(.*)$/is);
    if (!match) throw new Error("Use: wait 300 => MiniKode statements");
    const timer = setTimeout(() => {
      try { executeStatements(match[2], event, self); }
      catch (error) { runtime.errors++; log(`Delayed action error: ${error.message}`, "err"); stats(); }
    }, Number(match[1]));
    runtime.cleanup.push(() => clearTimeout(timer));
    return;
  }

  if (/^emit\s+/i.test(source)) {
    match = source.match(/^emit\s+(\S+)(?:\s+(.+))?$/is);
    if (!match) throw new Error("Use: emit eventName [value]");
    window.dispatchEvent(new CustomEvent(match[1], { detail: resolveValue(match[2] || "") }));
    return;
  }

  if (/^focus\s+/i.test(source)) { requireElement(source.replace(/^focus\s+/i, "")).focus(); return; }

  if (/^increment\s+/i.test(source) || /^decrement\s+/i.test(source)) {
    match = source.match(/^(increment|decrement)\s+([A-Za-z_$][\w$]*)(?:\s+(.+))?$/i);
    if (!match) throw new Error("Use: increment variableName [amount]");
    const amount = match[3] ? Number(resolveValue(match[3])) : 1;
    if (!Number.isFinite(amount)) throw new Error("The increment/decrement amount must be a number.");
    const current = Number(runtime.vars[match[2]]) || 0;
    runtime.vars[match[2]] = current + (match[1].toLowerCase() === "increment" ? amount : -amount);
    return;
  }

  if (/^repeat\s+/i.test(source)) {
    match = source.match(/^repeat\s+(\d+)\s*(?:=>)?\s*(.+)$/is);
    if (!match) throw new Error("Use: repeat 5 => MiniKode command");
    const count = Math.min(Number(match[1]), 1000);
    const previousIndex = runtime.vars.$index;
    for (let index = 0; index < count; index++) {
      runtime.vars.$index = index;
      executeStatements(match[2], event, self);
    }
    if (previousIndex === undefined) delete runtime.vars.$index;
    else runtime.vars.$index = previousIndex;
    return;
  }

  if (/^if\s+/i.test(source)) {
    match = source.match(/^if\s+(.+?)\s*=>\s*(.*)$/is);
    if (!match) throw new Error("Use: if expression => MiniKode command");
    if (Boolean(evaluate(match[1]))) executeStatements(match[2], event, self);
    return;
  }

  throw new Error(`Unknown statement '${source}'.`);
}

function executeStatements(code, event = null, self = null) {
  runtime.vars.$event = event;
  runtime.vars.$self = self;
  for (const statement of splitTopLevel(String(code), ";")) {
    executeStatement(statement, event, self);
  }
}

/* ---------- top-level program parser ---------- */

function runLine(line) {
  if (/^create\s+/i.test(line)) { createElement(line); return; }

  let match = line.match(/^on\s+(\S+)\s+(\w+)\s*=>\s*(.*)$/is);
  if (match) {
    const element = requireElement(match[1]);
    bind(element, match[2], match[3]);
    return;
  }

  if (/^let\s+/i.test(line) || /^set\s+/i.test(line) || /^repeat\s+/i.test(line) || /^if\s+/i.test(line)) {
    executeStatement(line);
    return;
  }

  if (/^(show|hide|toggle|remove|addclass|delclass|log|alert|wait|emit|focus|increment|decrement)\b/i.test(line)) {
    executeStatement(line);
    return;
  }

  throw new Error(`Unknown command '${line.split(/\s+/)[0] || line}'.`);
}

/* ---------- physics ---------- */

const physics = {
  gravity: 0.45,
  friction: 0.995,
  running: false,
  loopId: 0,
  add(element, parameters) {
    const parent = element.offsetParent || element.parentElement || refs.preview;
    const object = {
      el: element,
      parent,
      x: element.offsetLeft,
      y: element.offsetTop,
      vx: Number(parameters.vx) || 0,
      vy: Number(parameters.vy) || 0,
      bounce: Number(parameters.bounce ?? 0.75),
      friction: Number(parameters.friction ?? this.friction),
      gravity: Number(parameters.gravity ?? this.gravity),
      static: Boolean(parameters.static)
    };
    runtime.physics.set(element, object);
    this.start();
  },
  start() {
    if (this.running) return;
    this.running = true;
    let previousTime = 0;
    const tick = time => {
      if (!this.running) return;
      const delta = previousTime ? Math.min((time - previousTime) / 16.67, 2.5) : 1;
      previousTime = time;

      for (const object of runtime.physics.values()) {
        if (object.static || !object.el.isConnected || !object.parent.isConnected) continue;
        object.vy += object.gravity * delta;
        object.vx *= Math.pow(object.friction, delta);
        object.vy *= Math.pow(object.friction, delta);
        object.x += object.vx * delta;
        object.y += object.vy * delta;

        const width = object.el.offsetWidth || 1;
        const height = object.el.offsetHeight || 1;
        const boundsWidth = object.parent.clientWidth || refs.preview.clientWidth;
        const boundsHeight = object.parent.clientHeight || refs.preview.clientHeight;

        if (object.x < 0) { object.x = 0; object.vx = Math.abs(object.vx) * object.bounce; }
        if (object.x + width > boundsWidth) { object.x = Math.max(0, boundsWidth - width); object.vx = -Math.abs(object.vx) * object.bounce; }
        if (object.y < 0) { object.y = 0; object.vy = Math.abs(object.vy) * object.bounce; }
        if (object.y + height > boundsHeight) { object.y = Math.max(0, boundsHeight - height); object.vy = -Math.abs(object.vy) * object.bounce; }

        object.el.style.left = `${object.x}px`;
        object.el.style.top = `${object.y}px`;
      }
      this.loopId = requestAnimationFrame(tick);
    };
    this.loopId = requestAnimationFrame(tick);
  },
  stop() {
    this.running = false;
    if (this.loopId) cancelAnimationFrame(this.loopId);
    this.loopId = 0;
  }
};

function addPhysics(element, parameters) {
  if (parameters.velocity != null) {
    const velocity = String(parameters.velocity).split(/[\s,]+/).filter(Boolean).map(Number);
    if (velocity.length > 2 || velocity.some(value => !Number.isFinite(value))) {
      throw new Error("velocity expects two numbers, such as: velocity: \"3,-1\"");
    }
    parameters.vx = velocity[0] || 0;
    parameters.vy = velocity[1] || 0;
  }
  element.style.position = "absolute";
  physics.add(element, parameters);
}

/* ---------- formatter ---------- */

function formatCode(code) {
  const lines = normalizeLines(code);
  if (!lines.length) return "BMK\nEMK";
  const output = ["BMK"];
  for (const line of lines) {
    if (/^create\s+/i.test(line)) {
      const { head, body } = extractBraced(line);
      if (body) {
        const pieces = splitTopLevel(body, ",;\n");
        output.push(`  ${head} { ${pieces.join("; ")} }`);
      } else output.push(`  ${line}`);
    } else {
      output.push(`  ${line}`);
    }
  }
  output.push("EMK");
  return output.join("\n");
}

function loadTemplate(name, autoRun = true) {
  refs.editor.value = templates[name] || templates.hello;
  stats();
  if (autoRun) run();
}

/* ---------- run / save / load ---------- */

function getProgramBody(source) {
  const lines = String(source).replace(/^\uFEFF/, "").split(/\r?\n/);
  let first = 0;
  let last = lines.length - 1;
  while (first <= last && !lines[first].trim()) first++;
  while (last >= first && !lines[last].trim()) last--;
  if (first > last || lines[first].trim().toUpperCase() !== "BMK") {
    throw new Error("Program must start with BMK on its own line.");
  }
  if (lines[last].trim().toUpperCase() !== "EMK") {
    throw new Error("Program must end with EMK on its own line.");
  }
  return lines.slice(first + 1, last).join("\n");
}

function run() {
  refs.console.replaceChildren();
  runtime.errors = 0;
  runtime.commands = 0;
  runtime.running = true;
  clearRuntime();

  try {
    const body = getProgramBody(refs.editor.value);
    const lines = normalizeLines(body);
    if (!lines.length) throw new Error("Program is empty.");

    for (let index = 0; index < lines.length; index++) {
      try {
        runLine(lines[index]);
        runtime.commands++;
      } catch (error) {
        runtime.errors++;
        log(`Command ${index + 1}: ${error.message}`, "err");
      }
    }

    log(`Build finished — ${runtime.commands} command(s), ${runtime.errors} error(s).`, runtime.errors ? "warn" : "ok");
  } catch (error) {
    runtime.errors++;
    log(`Build failed: ${error.message}`, "err");
  }
  stats();
}

function save() {
  try {
    localStorage.setItem("minikode.project", refs.editor.value);
    log("Project saved in this browser.", "ok");
  } catch (error) {
    log(`Could not save the project: ${error.message}`, "err");
  }
}

function load() {
  try {
    const code = localStorage.getItem("minikode.project");
    if (code == null) { log("No saved project found in this browser.", "warn"); return; }
    refs.editor.value = code;
    stats();
    log("Project loaded.", "ok");
  } catch (error) {
    log(`Could not load the project: ${error.message}`, "err");
  }
}

/* ---------- interface ---------- */

$("#runBtn").addEventListener("click", run);
$("#refreshBtn").addEventListener("click", run);
$("#formatBtn").addEventListener("click", () => {
  try {
    refs.editor.value = formatCode(refs.editor.value);
    stats();
    log("Formatted MiniKode.", "ok");
  } catch (error) {
    runtime.errors++;
    stats();
    log(`Format error: ${error.message}`, "err");
  }
});
$("#saveBtn").addEventListener("click", save);
$("#loadBtn").addEventListener("click", load);
$("#clearBtn").addEventListener("click", () => {
  refs.editor.value = "";
  clearRuntime();
  refs.console.replaceChildren();
  runtime.errors = 0;
  runtime.commands = 0;
  runtime.running = false;
  stats();
});
$("#consoleClear").addEventListener("click", () => refs.console.replaceChildren());
document.querySelectorAll("[data-template]").forEach(button => {
  button.addEventListener("click", () => loadTemplate(button.dataset.template));
});

refs.editor.addEventListener("input", stats);
refs.editor.addEventListener("keydown", event => {
  if ((event.ctrlKey || event.metaKey) && event.key === "Enter") {
    event.preventDefault();
    run();
  }
  if (event.key === "Tab") {
    event.preventDefault();
    const start = event.target.selectionStart;
    const end = event.target.selectionEnd;
    event.target.setRangeText("  ", start, end, "end");
  }
});

refs.hint.innerHTML = `
